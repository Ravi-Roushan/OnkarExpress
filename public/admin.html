<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Onkar Express - Admin Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Barlow',sans-serif;background:#F5F5F5;color:#212121}
header{background:#1A1A2E;color:#fff;padding:1rem 2rem;display:flex;justify-content:space-between;align-items:center}
header h1{font-family:'Rajdhani',sans-serif;font-size:22px;font-weight:700}
header h1 span{color:#FDD835}
.logout-btn{background:#D32F2F;color:#fff;border:none;padding:8px 16px;border-radius:4px;cursor:pointer;font-weight:600;font-size:13px}
.container{max-width:1300px;margin:0 auto;padding:2rem}

/* Login */
#loginScreen{display:flex;align-items:center;justify-content:center;height:100vh;background:#1A1A2E}
.login-box{background:#fff;border-radius:10px;padding:2.5rem;width:340px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.login-box h2{font-family:'Rajdhani',sans-serif;font-size:24px;margin-bottom:1.5rem;color:#1A1A2E;text-align:center}
.login-box label{font-size:13px;font-weight:600;display:block;margin-bottom:6px;color:#1A1A2E}
.login-box input{width:100%;padding:11px;border:1.5px solid #E0E0E0;border-radius:6px;margin-bottom:1rem;font-size:14px}
.login-box button{width:100%;background:#D32F2F;color:#fff;border:none;padding:12px;border-radius:6px;font-weight:700;cursor:pointer;font-size:15px}
.login-error{color:#C62828;font-size:13px;text-align:center;margin-top:.5rem;display:none}

/* Dashboard */
#dashboard{display:none}
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1rem;margin-bottom:2rem}
.stat-card{background:#fff;border-radius:10px;padding:1.25rem;border:1.5px solid #E0E0E0}
.stat-card .num{font-family:'Rajdhani',sans-serif;font-size:32px;font-weight:700;color:#D32F2F}
.stat-card .label{font-size:13px;color:#757575;margin-top:4px}

table{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden;border:1.5px solid #E0E0E0}
th,td{padding:12px 14px;text-align:left;font-size:13px;border-bottom:1px solid #E0E0E0}
th{background:#1A1A2E;color:#fff;font-weight:600;font-size:12px;letter-spacing:.5px;text-transform:uppercase}
tr:hover td{background:#FFFDE7}
.badge{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
.badge-booked{background:#FFF3E0;color:#E65100}
.badge-transit{background:#E3F2FD;color:#1565C0}
.badge-delivered{background:#E8F5E9;color:#2E7D32}
.badge-paid{background:#E8F5E9;color:#2E7D32}
.badge-pending{background:#FFEBEE;color:#C62828}
.badge-cod{background:#F5F5F5;color:#757575}
.action-row{display:flex;gap:6px}
.action-row select,.action-row button{padding:6px 10px;font-size:12px;border-radius:4px;border:1px solid #E0E0E0}
.action-row button{background:#1A1A2E;color:#fff;border:none;cursor:pointer;font-weight:600}
.refresh-btn{background:#1A1A2E;color:#fff;border:none;padding:10px 20px;border-radius:6px;cursor:pointer;font-weight:600;margin-bottom:1rem}
.empty{text-align:center;padding:3rem;color:#757575}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-box">
    <h2><span style="color:#D32F2F">ONKAR</span> EXPRESS Admin</h2>
    <label>Username</label>
    <input type="text" id="loginUser" placeholder="admin"/>
    <label>Password</label>
    <input type="password" id="loginPass" placeholder="••••••••"/>
    <button onclick="login()">Log In</button>
    <div class="login-error" id="loginError">Invalid username or password.</div>
  </div>
</div>

<div id="dashboard">
  <header>
    <h1>ONKAR <span>EXPRESS</span> — Admin Dashboard</h1>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </header>
  <div class="container">
    <div class="stats-row" id="statsRow"></div>
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:20px;flex-wrap:wrap;">

<input
id="searchBooking"
type="text"
placeholder="Search AWB / Customer / Phone"
style="
flex:1;
min-width:250px;
padding:10px 14px;
border:1px solid #ddd;
border-radius:6px;
font-size:14px;
">

<div style="display:flex;gap:10px;">

<button class="refresh-btn" onclick="loadBookings()">
    <i class="ti ti-refresh"></i> Refresh
</button>

<button
class="refresh-btn"
style="background:#1565C0"
onclick="openDispatch()">

<i class="ti ti-truck-delivery"></i>
Dispatch

</button>

<button
class="refresh-btn"
style="background:#2E7D32"
onclick="exportBookings()">

<i class="ti ti-download"></i>
Export

</button>
</div>
</div>

<div id="tableWrap"></div>

<hr style="margin:40px 0">

<h2 style="margin-bottom:20px;color:#1A1A2E;">
Analytics Dashboard
</h2>

<div style="
display:grid;
grid-template-columns:repeat(auto-fit,minmax(350px,1fr));
gap:25px;
">

<div class="stat-card">
<h3>Monthly Bookings</h3>
<canvas id="bookingChart"></canvas>
</div>

<div class="stat-card">
<h3>Revenue</h3>
<canvas id="revenueChart"></canvas>
</div>

<div class="stat-card">
<h3>Payment Methods</h3>
<canvas id="paymentChart"></canvas>
</div>

<div class="stat-card">
<h3>Delivery Status</h3>
<canvas id="statusChart"></canvas>
</div>

</div>
</div>
</div>

<!-- Booking Details Modal -->
 <div id="dispatchModal"
style="
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.6);
justify-content:center;
align-items:center;
z-index:9999;">

<div style="
background:#fff;
width:700px;
max-width:95%;
border-radius:10px;
padding:25px;">

<h2 style="margin-bottom:20px;">
Vehicle Dispatch
</h2>

<label>Vehicle Number</label>

<input
id="vehicleNo"
type="text"
placeholder="BR01AB1234"
style="width:100%;padding:10px;margin:8px 0 15px;">

<label>Driver Name</label>

<input
id="driverName"
type="text"
placeholder="Driver Name"
style="width:100%;padding:10px;margin:8px 0 15px;">

<div
id="dispatchBookings"
style="
max-height:300px;
overflow:auto;
border:1px solid #ddd;
padding:10px;">
</div>

<div
style="margin-top:20px;text-align:right;">

<button
onclick="generateTripSheet()"
style="
background:#2E7D32;
color:#fff;
padding:10px 20px;
border:none;
border-radius:5px;">

Generate Trip Sheet

</button>

<button
onclick="closeDispatch()"
style="
background:#D32F2F;
color:#fff;
padding:10px 20px;
border:none;
border-radius:5px;
margin-left:10px;">
Close
</button>
</div>
</div>
</div>
<div id="bookingModal" style="display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.6);
justify-content:center;
align-items:center;
z-index:9999;">

<div style="
background:#fff;
width:520px;
max-width:95%;
border-radius:10px;
padding:25px;
box-shadow:0 10px 40px rgba(0,0,0,.3);
">

<h2 style="margin-bottom:20px;color:#1A1A2E;">
ONKAR EXPRESS
</h2>

<div id="modalContent"></div>

<div style="margin-top:25px;text-align:right;">

<button
onclick="printReceipt()"
style="
background:#2E7D32;
color:#fff;
border:none;
padding:10px 18px;
border-radius:5px;
cursor:pointer;
margin-right:10px;">
Print
</button>

<button
onclick="closeModal()"
style="
background:#D32F2F;
color:#fff;
border:none;
padding:10px 18px;
border-radius:5px;
cursor:pointer;">
Close
</button>

</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="admin.js"></script>

</body>
</html>
